<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Recipe Sharing</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 4rem 2rem;">

  <div style="width: 100%; max-width: 1200px;">
    
    <div class="dashboard-header">
        <div>
            <h1 style="font-family: 'Playfair Display', serif; font-weight: 800;">My Recipes</h1>
            <p style="color: var(--text-secondary);">Manage your shared recipes</p>
        </div>
        <div>
            <button id="addRecipeBtn" class="btn-primary" style="width: auto;">+ Add New Recipe</button>
            <button onclick="window.location.href='index.html'" class="btn-secondary" style="width: auto; margin-top: 0; margin-left: 1rem;">Log Out</button>
        </div>
    </div>

    <!-- Recipe Grid -->
    <div id="recipeGrid" class="recipe-grid">
        <!-- Recipes will be injected here by JavaScript -->
    </div>
  </div>

  <!-- Add Recipe Modal -->
  <div id="recipeModal" class="modal-overlay">
      <div class="modal-content">
          <div class="modal-header">
              <h2 style="font-family: 'Playfair Display', serif;">Add New Recipe</h2>
              <button id="closeModalBtn" class="close-btn">&times;</button>
          </div>
          <form id="addRecipeForm">
              <div class="form-group">
                  <label for="recipeTitle">Recipe Title</label>
                  <input type="text" id="recipeTitle" class="form-input" required placeholder="e.g. Classic Margherita Pizza">
              </div>
              <div class="form-group">
                  <label for="recipeDesc">Description</label>
                  <textarea id="recipeDesc" class="form-input" required placeholder="A brief description of the recipe..." rows="3" style="resize: vertical;"></textarea>
              </div>
              <div class="form-group">
                  <label for="recipeIngredients">Ingredients (comma-separated)</label>
                  <input type="text" id="recipeIngredients" class="form-input" required placeholder="e.g. Flour, Water, Yeast, Salt, Tomatoes, Cheese">
              </div>
              <button type="submit" class="btn-primary">Save Recipe</button>
          </form>
      </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
