<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Recipe Sharing</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-bg" style="display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 4rem 2rem;">

  <div style="width: 100%; max-width: 1200px;">
    
    <div class="dashboard-header">
        <div>
            <h1 style="font-family: 'Playfair Display', serif; font-weight: 800;">My Recipes</h1>
            <p style="color: var(--text-secondary);">Manage your shared recipes</p>
        </div>
        <div>
            <button id="adminPanelBtn" onclick="window.location.href='admin.html'" class="btn-primary d-none" style="width: auto; background: var(--accent-color);">Admin Panel</button>
            <button onclick="window.location.href='profile.html'" class="btn-primary" style="width: auto; background: #6b7280;">My Profile</button>
            <button id="addRecipeBtn" class="btn-primary" style="width: auto;">+ Add New Recipe</button>
            <button onclick="window.location.href='index.html'" class="btn-secondary" style="width: auto; margin-top: 0; margin-left: 1rem;">Log Out</button>
        </div>
    </div>

    <!-- Search and Filter Bar -->
    <div style="background: var(--glass-bg); backdrop-filter: blur(16px); padding: 1.5rem; border-radius: var(--bento-radius); border: var(--glass-border); margin-bottom: 2rem; display: flex; gap: 1rem;">
        <input type="text" id="searchInput" class="form-input" style="margin-bottom: 0;" placeholder="Search 500+ global recipes or your local ones...">
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="d-none" style="text-align: center; padding: 2rem; color: var(--accent-color); font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 600;">
        Fetching recipes from around the world...
    </div>

    <!-- Recipe Grid -->
    <div id="recipeGrid" class="recipe-grid">
        <!-- Recipes will be injected here by JavaScript -->
    </div>
  </div>

  <!-- Add Recipe Modal -->
  <div id="recipeModal" class="modal-overlay">
      <div class="modal-content">
          <div class="modal-header">
              <h2 style="font-family: 'Playfair Display', serif;">Add New Recipe</h2>
              <button id="closeModalBtn" class="close-btn">&times;</button>
          </div>
          <form id="addRecipeForm">
              <div class="form-group">
                  <label for="recipeTitle">Recipe Title</label>
                  <input type="text" id="recipeTitle" class="form-input" required placeholder="e.g. Classic Margherita Pizza">
              </div>
              <div class="form-group">
                  <label for="recipeImage">Image URL (Optional)</label>
                  <input type="url" id="recipeImage" class="form-input" placeholder="https://example.com/image.jpg">
              </div>
              <div class="form-group">
                  <label for="recipeDesc">Description</label>
                  <textarea id="recipeDesc" class="form-input" required placeholder="A brief description of the recipe..." rows="3" style="resize: vertical;"></textarea>
              </div>
              <div class="form-group">
                  <label for="recipeIngredients">Ingredients (comma-separated)</label>
                  <input type="text" id="recipeIngredients" class="form-input" required placeholder="e.g. Flour, Water, Yeast, Salt, Tomatoes, Cheese">
              </div>
              <button type="submit" class="btn-primary">Save Recipe</button>
          </form>
      </div>
  </div>

  <!-- Detailed Recipe Modal -->
  <div id="detailedRecipeModal" class="modal-overlay">
      <div class="modal-content" style="max-width: 900px; padding: 0; overflow: hidden; display: flex; flex-direction: column;">
          <div style="position: relative;">
              <button id="closeDetailedBtn" class="close-btn" style="position: absolute; top: 1rem; right: 1.5rem; background: rgba(0,0,0,0.5); color: white; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; z-index: 10;">&times;</button>
              <img id="detailImage" src="" alt="Recipe" style="width: 100%; height: 300px; object-fit: cover;">
          </div>
          <div style="padding: 2.5rem; overflow-y: auto; max-height: 50vh;">
              <h2 id="detailTitle" style="font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--text-primary);">Recipe Title</h2>
              <p id="detailArea" style="color: var(--accent-color); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; margin-bottom: 2rem;">Indian Cuisine</p>
              
              <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 3rem;">
                  <div>
                      <h3 style="font-family: 'Playfair Display', serif; margin-bottom: 1rem;">Ingredients</h3>
                      <ul id="detailIngredients" style="list-style-type: none; padding: 0; display: flex; flex-direction: column; gap: 0.5rem;">
                          <!-- Injected via JS -->
                      </ul>
                  </div>
                  <div>
                      <h3 style="font-family: 'Playfair Display', serif; margin-bottom: 1rem;">Instructions</h3>
                      <div id="detailInstructions" style="line-height: 1.8; color: var(--text-secondary); white-space: pre-wrap;">
                          <!-- Injected via JS -->
                      </div>
                  </div>
              </div>
          </div>
      </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
