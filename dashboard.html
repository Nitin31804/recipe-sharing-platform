<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Recipe Sharing</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 4rem 2rem;">

  <div class="widget" style="width: 100%; max-width: 800px; text-align: center;">
    <h1 style="margin-bottom: 1rem; font-family: 'Playfair Display', serif; font-weight: 800;">Welcome to your Dashboard!</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">You have successfully logged in.</p>
    
    <div style="padding: 2rem; background: var(--bg-color); border-radius: var(--bento-radius); border: var(--glass-border);">
        <h3 style="margin-bottom: 1rem;">Your Recipes</h3>
        <p style="color: var(--text-secondary);">This is where your shared recipes and saved favorites will appear once the backend is connected.</p>
    </div>

    <div style="margin-top: 2rem;">
        <button onclick="window.location.href='index.html'" class="btn-secondary" style="width: auto;">Log Out</button>
    </div>
  </div>

</body>
</html>
