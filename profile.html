<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | Dacha Stays Inspired</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-bg" style="display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 4rem 2rem;">

  <div style="width: 100%; max-width: 900px;">
    
    <!-- Profile Header -->
    <div class="dashboard-header" style="margin-bottom: 2rem;">
        <div>
            <h1 style="font-family: 'Playfair Display', serif; font-weight: 800;">My Profile</h1>
            <p style="color: var(--text-secondary);">Your account details and stats</p>
        </div>
        <div>
            <button onclick="window.location.href='dashboard.html'" class="btn-secondary" style="width: auto;">Back to Dashboard</button>
            <button onclick="window.location.href='index.html'" class="btn-primary" style="width: auto; background: #ef4444; margin-left: 1rem;">Log Out</button>
        </div>
    </div>

    <!-- Profile Details Card -->
    <div class="admin-stats-card" style="display: flex; align-items: center; text-align: left; gap: 2rem; padding: 3rem;">
        <!-- Avatar -->
        <div style="width: 120px; height: 120px; border-radius: 50%; background: var(--accent-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-family: 'Playfair Display', serif; font-weight: 800; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            U
        </div>
        
        <!-- Info -->
        <div style="flex-grow: 1;">
            <h2 id="profileName" style="font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--text-primary);">Test User</h2>
            <p id="profileEmail" style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 1.5rem;">user@example.com</p>
            
            <div style="display: flex; gap: 2rem;">
                <div>
                    <strong style="color: var(--text-secondary); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.1em;">Recipes Shared</strong>
                    <div id="recipeCount" class="stats-number" style="font-size: 2.5rem; margin: 0.2rem 0;">0</div>
                </div>
                <div>
                    <strong style="color: var(--text-secondary); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.1em;">Member Since</strong>
                    <div id="joinDate" class="stats-number" style="font-size: 1.5rem; margin: 0.8rem 0 0 0; color: var(--text-primary); font-family: 'Outfit', sans-serif; font-weight: 500;">Today</div>
                </div>
            </div>
        </div>
    </div>

  </div>

  <script src="profile.js"></script>
</body>
</html>
