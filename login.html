<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Recipe Sharing</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem 0;">

  <div class="widget" style="width: 100%; max-width: 400px;">
    <h1 style="text-align: center; margin-bottom: 2rem; font-family: 'Playfair Display', serif; font-weight: 800;">Welcome Back</h1>
    
    <div id="loginError" class="d-none" style="background: rgba(239, 68, 68, 0.1); color: var(--error-color); padding: 1rem; border-radius: 0.5rem; text-align: center; margin-bottom: 1.5rem; font-size: 0.9rem; border: 1px solid rgba(239, 68, 68, 0.2);">
      Your account has been blocked by an administrator.
    </div>

    <form id="loginForm">
      <!-- Email/ID Field -->
      <div class="form-group">
        <label for="email">Email Address or Admin ID</label>
        <input type="text" class="form-input" id="email" placeholder="Enter your email or ID" required>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-input" id="password" placeholder="Enter password" required>
      </div>

      <!-- Buttons -->
      <div>
        <button type="submit" class="btn-primary">Log In</button>
      </div>

      <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
        Don't have an account? <a href="index.html" style="color: var(--accent-color); font-weight: 600;">Sign up</a>
      </p>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Prevent page reload
      
      // Simulate successful login
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginError = document.getElementById('loginError');
      
      loginError.classList.add('d-none');

      // Check if user is blocked
      const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
      const userRecord = registeredUsers.find(u => u.email === email || u.username === email);
      
      if (userRecord && userRecord.isBlocked) {
          loginError.classList.remove('d-none');
          document.getElementById('password').value = '';
          return; // Stop login
      }

      if ((email === 'admin@admin.com' || email === 'admin') && password === 'admin123') {
          localStorage.setItem('isAdminLoggedIn', 'true');
      } else {
          localStorage.removeItem('isAdminLoggedIn');
      }

      const btn = document.querySelector('.btn-primary');
      btn.textContent = 'Authenticating...';
      btn.disabled = true;

      // Redirect after a short delay
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    });
  </script>
</body>
</html>
