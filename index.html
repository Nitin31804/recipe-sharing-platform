<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Recipe Sharing</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem 0;">

  <div class="widget" style="width: 100%; max-width: 450px;">
    <h1 style="text-align: center; margin-bottom: 2rem; font-family: 'Playfair Display', serif; font-weight: 800;">Create Account</h1>
    
    <!-- Success Message -->
    <div id="successMessage" class="alert alert-success d-none">
      Registration successful! Welcome to Recipe Sharing.
    </div>

    <form id="registrationForm" novalidate>
      <!-- Username Field -->
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" class="form-input" id="username" placeholder="Choose a username" required>
        <div id="usernameError" class="text-danger"></div>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" class="form-input" id="email" placeholder="Enter your email" required>
        <div id="emailError" class="text-danger"></div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-input" id="password" placeholder="Enter password" required>
        <small class="form-text">Min 8 characters, 1 uppercase, 1 number, 1 special char</small>
        <div id="passwordError" class="text-danger"></div>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" class="form-input" id="confirmPassword" placeholder="Confirm password" required>
        <div id="confirmPasswordError" class="text-danger"></div>
      </div>

      <!-- Terms Checkbox -->
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="terms" required>
        <label class="form-check-label" for="terms">
          I agree to the terms and conditions
        </label>
      </div>
      <div id="termsError" class="text-danger" style="margin-top: -1rem; margin-bottom: 1.5rem;"></div>

      <!-- Buttons -->
      <div>
        <button type="submit" class="btn-primary">Sign Up</button>
        <button type="reset" class="btn-secondary">Clear Form</button>
      </div>

      <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
        Already have an account? <a href="login.html" style="color: var(--accent-color); font-weight: 600;">Log in</a>
      </p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
