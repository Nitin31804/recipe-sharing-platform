<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Sharing - Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">🍳 Recipe Sharing Platform</span>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg">
          <div class="card-body">
            <h2 class="card-title text-center mb-4">Create Account</h2>
            
            <!-- Success Message -->
            <div id="successMessage" class="alert alert-success alert-dismissible fade show d-none" role="alert">
              ✅ Registration successful! Welcome to Recipe Sharing.
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form id="registrationForm" novalidate>
              <!-- Username Field -->
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Choose a username" required>
                <div id="usernameError" class="text-danger small mt-1"></div>
              </div>

              <!-- Email Field -->
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                <div id="emailError" class="text-danger small mt-1"></div>
              </div>

              <!-- Password Field -->
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                <small class="form-text text-muted">Min 8 characters, 1 uppercase, 1 number</small>
                <div id="passwordError" class="text-danger small mt-1"></div>
              </div>

              <!-- Confirm Password Field -->
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" required>
                <div id="confirmPasswordError" class="text-danger small mt-1"></div>
              </div>

              <!-- Terms Checkbox -->
              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terms" required>
                <label class="form-check-label" for="terms">
                  I agree to the terms and conditions
                </label>
                <div id="termsError" class="text-danger small mt-1"></div>
              </div>

              <!-- Buttons -->
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">Register</button>
                <button type="reset" class="btn btn-secondary">Clear Form</button>
              </div>

              <p class="text-center mt-3 text-muted">
                Already have an account? <a href="#" class="text-primary">Login here</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center mt-5 py-3 text-muted">
    <p>&copy; 2026 Recipe Sharing Platform. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
